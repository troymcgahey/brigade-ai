[project]
name = "brigade-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "troymcgahey", email = "tmcgahey93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.10",
    "mcp<2",
]

[project.scripts]
brigade-ai = "brigade_ai:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
